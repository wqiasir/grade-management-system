[project]
name = "gradeapp"
version = "0.1.0"
description = "杭电计算机学院学生成绩管理系统（软件工程课程实践）"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<3.2",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Migrate>=4,<5",
    "Flask-WTF>=1.2,<2",
    "openpyxl>=3.1,<4",
    "waitress>=3,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gradeapp"]

[tool.setuptools.package-data]
gradeapp = ["templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:gradeapp.*"]

[tool.coverage.run]
source = ["gradeapp"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
